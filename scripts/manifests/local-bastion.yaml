apiVersion: v1
kind: Namespace
metadata:
  name: test-ssh-bastion
  labels:
    app.kubernetes.io/managed-by: system-tests-local-bastion
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
    security.openshift.io/scc.podSecurityLabelSync: "false"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ssh-bastion
  namespace: test-ssh-bastion
automountServiceAccountToken: false
---
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: system-tests-local-bastion
  labels:
    app.kubernetes.io/managed-by: system-tests-local-bastion
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
# OpenSSH uses chroot before authentication and writes Linux audit records.
allowedCapabilities:
  - SYS_CHROOT
  - AUDIT_WRITE
requiredDropCapabilities:
  - MKNOD
runAsUser:
  type: MustRunAs
  uid: 0
seLinuxContext:
  type: MustRunAs
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
volumes:
  - secret
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ssh-bastion
  namespace: test-ssh-bastion
rules:
  - apiGroups: [security.openshift.io]
    resources: [securitycontextconstraints]
    resourceNames: [system-tests-local-bastion]
    verbs: [use]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ssh-bastion
  namespace: test-ssh-bastion
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ssh-bastion
subjects:
  - kind: ServiceAccount
    name: ssh-bastion
    namespace: test-ssh-bastion
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssh-bastion
  namespace: test-ssh-bastion
spec:
  replicas: 1
  selector:
    matchLabels:
      run: ssh-bastion
  template:
    metadata:
      labels:
        run: ssh-bastion
    spec:
      serviceAccountName: ssh-bastion
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/master: ""
        kubernetes.io/os: linux
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: ssh-bastion
          image: quay.io/eparis/ssh:latest
          command:
            - /bin/bash
            - -ec
            - |
              id core >/dev/null 2>&1 || useradd --create-home --shell /bin/bash core
              # Secret mount directory permissions fail OpenSSH StrictModes checks.
              install -d -m 0700 -o core -g core /home/core/.ssh
              install -m 0600 -o core -g core /etc/bastion/authorized_keys /home/core/.ssh/authorized_keys
              exec /usr/sbin/sshd -D -e -f /etc/bastion/sshd_config
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - SYS_CHROOT
                - AUDIT_WRITE
          ports:
            - name: ssh
              containerPort: 2222
          readinessProbe:
            tcpSocket:
              port: ssh
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: configuration
              mountPath: /etc/bastion
              readOnly: true
      volumes:
        - name: configuration
          secret:
            secretName: ssh-bastion-config
            defaultMode: 0444
            items:
              - key: authorized_keys
                path: authorized_keys
              - key: sshd_config
                path: sshd_config
              - key: ssh_host_ed25519_key
                path: ssh_host_ed25519_key
                mode: 0400
