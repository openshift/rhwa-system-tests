name: Makefile CI

on:
  workflow_call:

  workflow_dispatch:

  push:
    branches:
      - main
      - 'release-\d.\d\d'

  pull_request:
    branches:
      - main
      - 'release-\d.\d\d'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SHELL: /bin/bash
      GOFLAGS: -mod=readonly

    steps:
      - uses: actions/checkout@v6

      - name: Check vendor is absent
        run: |
          test ! -d vendor
          test -z "$(git ls-files vendor)"
      
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: make deps-download

      - name: Run lint
        run: make lint

      - name: Install ginkgo
        run: go install github.com/onsi/ginkgo/v2/ginkgo

      - name: Run ginkgo Dry Run
        run: ginkgo run -vv -r --dry-run ./tests/
        env:
          ECO_DRY_RUN: true
          WORKLOAD_IMAGE: registry.access.redhat.com/ubi9/ubi-minimal:latest

      - name: Run unit tests
        run: make test

      - name: Check module files
        run: git diff --exit-code -- go.mod go.sum

  docker-build:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Build Dockerfile
        run: docker build -t system-tests:ci -f Dockerfile .

      - name: Compile suites offline
        run: |
          docker run --rm --network=none \
            --entrypoint /usr/bin/bash \
            -e GOPROXY=off -e GOFLAGS=-mod=readonly \
            -e ECO_DRY_RUN=true -e KUBECONFIG=/dev/null \
            -e WORKLOAD_IMAGE=registry.access.redhat.com/ubi9/ubi-minimal:latest \
            system-tests:ci -c \
            'test ! -d vendor && ginkgo run --dry-run ./tests/far-operator ./tests/mdr-operator ./tests/nhc-operator ./tests/nmo-operator ./tests/sbr-operator ./tests/snr-operator'
